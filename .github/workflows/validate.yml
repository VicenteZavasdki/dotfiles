name: Validate Dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON configs
        run: |
          python3 -c "import json; json.load(open('waybar/config'))"

      - name: Validate TOML configs
        run: |
          python3 -c "import tomllib; tomllib.load(open('atuin/config.toml', 'rb'))"

      - name: Validate KDL configs
        run: |
          cat zellij/config.kdl > /dev/null

      - name: Lint Fish config
        run: |
          grep -q "fish_add_path" fish/config.fish
